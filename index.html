<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0c">
  <title>Cinema Home</title>
  <link rel="preload" href="assets/vestrahorn.jpg" as="image">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#apps">Skip to apps</a>
  <div class="landscape" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark">cinema<span class="wordmark-rule"></span><span class="home-label">HOME</span></div>
      <nav class="utilities" aria-label="TV controls">
        <button class="utility" data-system="inputs">Inputs</button>
        <button class="utility" data-system="settings">Settings</button>
        <button class="clock utility" id="clock" aria-label="About this home screen">12:00 PM</button>
      </nav>
    </header>
    <main>
      <section class="intro" aria-labelledby="greeting">
        <div class="eyebrow" id="day-label">YOUR TIME, WELL SPENT</div>
        <h1 id="greeting">Settle in.</h1>
        <p class="intro-copy">A little less noise.<br>Something worth watching.</p>
      </section>
      <section class="apps-section" id="apps" aria-labelledby="apps-heading">
        <div class="section-top">
          <h2 id="apps-heading">Your apps</h2>
          <span class="connection" id="connection">Browser preview</span>
        </div>
        <div class="app-grid" id="app-grid">
          <button class="app-card youtube" data-app="youtube" aria-label="Open YouTube with TizenTube">
            <span class="card-face"><img src="assets/youtube.svg" alt="YouTube" width="160" height="45"></span>
            <span class="card-label">YouTube<span class="card-note">TizenTube</span></span>
          </button>
          <button class="app-card netflix" data-app="netflix" aria-label="Open Netflix">
            <span class="card-face"><img class="netflix-logo" src="assets/netflix.svg" alt="Netflix" width="138" height="40"></span>
            <span class="card-label">Netflix<span class="card-note">Films &amp; series</span></span>
          </button>
          <button class="app-card hbo" data-app="hbo" aria-label="Open HBO Max">
            <span class="card-face hbo-word">HBO<span>MAX</span></span>
            <span class="card-label">HBO Max<span class="card-note">Films &amp; series</span></span>
          </button>
          <button class="app-card prime" data-app="prime" aria-label="Open Prime Video">
            <span class="card-face"><img class="prime-logo" src="assets/primevideo.svg" alt="Prime Video" width="140" height="60"></span>
            <span class="card-label">Prime Video<span class="card-note">Films &amp; series</span></span>
          </button>
          <button class="app-card apple" data-app="apple" aria-label="Open Apple TV">
            <span class="card-face apple-word">Apple TV</span>
            <span class="card-label">Apple TV<span class="card-note">Films &amp; series</span></span>
          </button>
          <button class="app-card youtubetv" data-app="youtubetv" aria-label="Open YouTube TV">
            <span class="card-face"><img src="assets/youtube.svg" alt="" width="100" height="38"><span class="youtube-word">TV</span></span>
            <span class="card-label">YouTube TV<span class="card-note">Live television</span></span>
          </button>
        </div>
        <div class="selection-detail" aria-live="polite">
          <div><span id="selected-name">YouTube</span><span class="detail-divider">/</span><span id="selected-detail">Watch with TizenTube</span></div>
          <span class="select-hint"><kbd>OK</kbd> Open app</span>
        </div>
        <p class="status-message" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="footer">
      <span class="remote-hint">Arrow keys to browse<span class="footer-dot"></span>OK to open<span class="footer-dot"></span>Home for Samsung</span>
      <button class="about-button" id="about-button">A quieter home</button>
    </footer>
  </div>
  <div class="dialog-backdrop" id="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-body">
      <span class="eyebrow">CINEMA HOME</span>
      <h2 id="dialog-title">Your apps. Nothing extra.</h2>
      <div id="dialog-body"></div>
      <button class="dialog-close" id="dialog-close">Back to home</button>
    </section>
  </div>
</body>
</html>
